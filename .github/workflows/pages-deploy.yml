name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        # Default output dir is ./_site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # Runs before the upload so a broken link blocks the deploy rather than
      # shipping it.
      - name: Check links
        run: |
          mkdir -p /tmp/ctl
          printf '<!doctype html><html><head><title>t</title></head><body><a href="/missing-abc.html">x</a></body></html>' > /tmp/ctl/index.html
          echo "control: one <a href> to a file that does not exist -- a working"
          echo "checker MUST report a failure here."

          for v in 5.2.2 5.1.1 5.0.10 5.0.5; do
            echo; echo "=================== html-proofer $v ==================="
            gem install html-proofer -v "$v" --no-document >/dev/null 2>&1 || { echo "  install failed"; continue; }
            env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_PATH -u BUNDLE_APP_CONFIG \
              ruby -e '
                gem "html-proofer", ARGV[0]
                require "html_proofer"
                begin
                  HTMLProofer.check_directory("/tmp/ctl", disable_external: true).run
                  puts "  RESULT: passed (BAD -- broken link went undetected)"
                rescue StandardError => e
                  puts "  RESULT: #{e.class} (GOOD -- it caught the broken link)"
                end
              ' "$v" 2>&1 | sed 's/^/  /'
          done
          echo; echo "(diagnostic run -- not gating the deploy)"

      - name: Upload site artifact
        # uploads ./_site as "github-pages" by default
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Only the default branch is published. Other branches build above so the
    # output can be inspected without overwriting the live site.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
