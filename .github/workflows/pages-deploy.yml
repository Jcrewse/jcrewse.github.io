name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        # Default output dir is ./_site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # Runs before the upload so a broken link blocks the deploy rather than
      # shipping it.
      - name: Check links
        run: |
          echo "=== resolved versions inside the bundle ==="
          bundle list 2>/dev/null | grep -Ei 'html-proofer|nokogiri|addressable|typhoeus|ethon|zeitwerk|parallel|rainbow|yell|async|ffi' || true

          echo; echo "=== control fixture ==="
          mkdir -p /tmp/ctl
          printf '<!doctype html><html><head><title>t</title></head><body><a href="/missing-abc.html">x</a></body></html>' > /tmp/ctl/index.html

          echo; echo "=== standalone html-proofer, outside the bundle ==="
          gem install html-proofer --no-document >/dev/null 2>&1
          env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_PATH -u BUNDLE_APP_CONFIG \
            htmlproofer --version || true

          echo; echo "--- standalone on control (a FAILURE here proves extraction works) ---"
          env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_PATH -u BUNDLE_APP_CONFIG \
            htmlproofer /tmp/ctl --disable-external || echo "  (failed, as it should)"

          echo; echo "--- standalone on our site ---"
          env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_PATH -u BUNDLE_APP_CONFIG \
            htmlproofer ./_site --disable-external --swap-urls "^https\://jcrewse\.github\.io:" \
            || echo "  (failures reported above)"

      - name: Upload site artifact
        # uploads ./_site as "github-pages" by default
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Only the default branch is published. Other branches build above so the
    # output can be inspected without overwriting the live site.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
