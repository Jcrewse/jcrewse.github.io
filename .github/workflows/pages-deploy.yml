name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        # Default output dir is ./_site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # Runs before the upload so a broken link blocks the deploy rather than
      # shipping it.
      - name: Check links
        run: |
          set -o pipefail
          bundle exec ruby .github/scripts/check-links.rb 2>&1 | tee /tmp/proofer.log
          # Guard against a vacuous pass. If URL swapping stops matching, every
          # internal link is reclassified as external, skipped, and the check
          # reports success having verified nothing.
          if grep -q "Checking 0 internal links" /tmp/proofer.log; then
            echo "::error::htmlproofer checked 0 internal links -- swap_urls is no longer matching"
            exit 1
          fi

      - name: Upload site artifact
        # uploads ./_site as "github-pages" by default
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Only the default branch is published. Other branches build above so the
    # output can be inspected without overwriting the live site.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
